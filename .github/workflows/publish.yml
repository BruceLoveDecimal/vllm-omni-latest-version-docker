name: Build and publish stable vLLM-Omni image

on:
  workflow_dispatch:
    inputs:
      image_version:
        description: "Upstream vLLM-Omni image tag"
        required: true
        default: "0.28.0"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/brucelovedecimal/vllm-omni-latest-version-docker

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve upstream image version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.image_version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            IMAGE_VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.value }}
            ${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}

      - name: Verify published image metadata
        run: |
          image="${IMAGE_NAME}:v${{ steps.version.outputs.value }}"
          docker pull "${image}"
          docker run --rm --entrypoint python "${image}" -c '
          import importlib.metadata as m
          import torch
          assert m.version("vllm") == "${{ steps.version.outputs.value }}"
          assert m.version("vllm-omni") == "${{ steps.version.outputs.value }}"
          print("python runtime import check: PASS")
          print("torch.version.cuda:", torch.version.cuda)
          print("torch.cuda.is_available:", torch.cuda.is_available())
          '
